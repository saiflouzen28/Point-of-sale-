<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Account Activation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .header {
            text-align: center;
            background-color: #007bff;
            color: #ffffff;
            padding: 15px 0;
            border-radius: 8px 8px 0 0;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .activation-code {
            font-size: 1.5em;
            color: #007bff;
            font-weight: bold;
            margin: 20px 0;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            text-align: center;
            color: #666;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h2>Account Activation</h2>
        </div>
        <div class="content">
            <p>Dear User,</p>
            <p>Thank you for joining us! Please use the activation code below to activate your account:</p>
            <div class="activation-code">{{ code }}</div>
            <p>Alternatively, you can click the button below to activate your account:</p>
            <a href="http://127.0.0.1:8000/activate?token={{ code }}" class="btn">Activate My Account</a>
            <p>If you did not request this email, you can safely ignore it.</p>
        </div>
    </div>
</body>
</html>
